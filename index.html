<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>每一個選擇都很重要</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every choice matters. 每一個選擇都很重要：認識當季與在地食材，比較食譜碳排。">
<meta name="theme-color" content="#007580">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one long, projection-sized page. Sticky nav, month slider drives three food groups (veg / fruit / seafood),
   "I want to eat this" picks feed a recipe section, then carbon know-how cards, pledge, sources.
   Palette follows the Climate Fresk community charter: teal 00C6C1 / 007580, red E90000, yellow FFC629, pale E9F4F8. */
:root {
  --bg: #eef6f8;
  --surface: #ffffff;
  --ink: #0b2628;
  --ink2: #466a6e;
  --line: #cde2e7;
  --teal: #00c6c1;
  --teal-d: #007580;
  --teal-bg: #d8f3f1;
  --red: #d40000;
  --red-bg: #fde4e4;
  --yellow: #ffc629;
  --yellow-bg: #fff4d1;
  --shadow: 0 1px 0 rgba(0,40,45,.06);
  --f-head: "Open Sans", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Open Sans", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081c1e; --surface: #0f2c2e; --ink: #e8f5f5; --ink2: #9ebfc2; --line: #21464a;
    --teal-d: #35e0db; --teal-bg: #0d3a3b; --red: #ff7070; --red-bg: #3b1a1c; --yellow-bg: #3a3012;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081c1e; --surface: #0f2c2e; --ink: #e8f5f5; --ink2: #9ebfc2; --line: #21464a;
  --teal-d: #35e0db; --teal-bg: #0d3a3b; --red: #ff7070; --red-bg: #3b1a1c; --yellow-bg: #3a3012;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-head); font-stretch: 75%; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; }
h3 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--teal-d); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-block: 18px 10px; }
.brand { font-stretch: 75%; font-weight: 800; font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-d); }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, .btn { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
select { max-width: 100%; }
.btn:hover, select:hover { border-color: var(--teal-d); }

.hero { padding-block: 22px 28px; display: grid; gap: 14px; }
.hero h1 { font-size: clamp(2.8rem, 8.5vw, 6rem); font-weight: 800; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--teal-d); }
.hero .sub { font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--ink2); max-width: 46ch; }
.hero .reg { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; flex-wrap: wrap; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 99px; font-size: .85rem; font-weight: 700; background: var(--teal-bg); color: var(--teal-d); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.yel { background: var(--yellow-bg); color: var(--ink); }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 2px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.nav .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 6px; }
.nav a { white-space: nowrap; text-decoration: none; color: var(--ink); font-weight: 700; padding: 8px 14px; border-radius: 8px; }
.nav a:hover { background: var(--teal-bg); }

section { padding-block: 44px 8px; scroll-margin-top: 64px; }
.lead { color: var(--ink2); margin-top: 8px; max-width: 62ch; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.note { font-size: .88rem; color: var(--ink2); }

/* month */
.monthbox { display: grid; gap: 14px; margin-top: 22px; }
.mhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.mbig { font-stretch: 75%; font-weight: 800; font-size: clamp(3.4rem, 11vw, 6.5rem); line-height: 1; color: var(--teal-d); }
.mname { font-size: 1.4rem; font-weight: 700; color: var(--ink2); }
input[type=range] { width: 100%; height: 44px; accent-color: var(--teal-d); cursor: pointer; }
.mrow { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.mrow button { border: 2px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; min-height: 40px; cursor: pointer; font-weight: 700; }
.mrow button[aria-pressed=true] { background: var(--teal-d); border-color: var(--teal-d); color: #fff; }
.mrow button.now:not([aria-pressed=true]) { border-color: var(--yellow); }
@media (max-width: 560px) { .mrow { grid-template-columns: repeat(6, 1fr); } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .95rem; color: var(--ink2); }

/* groups */
.grp { margin-top: 34px; }
.grp h3 { display: flex; align-items: baseline; gap: 12px; font-size: 1.7rem; font-weight: 800; padding-bottom: 8px; border-bottom: 4px solid var(--teal); }
.grp h3 small { font-size: 1rem; font-weight: 600; color: var(--ink2); }
.grp.f h3 { border-bottom-color: var(--yellow); }
.grp.s h3 { border-bottom-color: var(--teal-d); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 16px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tile.on { border-color: var(--teal-d); background: var(--teal-bg); }
.tile .em { font-size: 2.4rem; line-height: 1; }
.tile .nm { font-size: 1.4rem; font-weight: 800; font-stretch: 85%; line-height: 1.15; }
.tile .nm2 { color: var(--ink2); font-size: .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.want { border: 2px solid var(--teal-d); background: transparent; color: var(--teal-d); border-radius: 10px; padding: 6px 10px; min-height: 44px; cursor: pointer; font-weight: 800; }
.want:hover { background: var(--teal-bg); }
.want[aria-pressed=true] { background: var(--teal-d); color: #fff; }
.mini { border: 2px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; min-height: 36px; cursor: pointer; font-size: .9rem; font-weight: 700; }
.mini:hover { border-color: var(--teal-d); }

/* cook */
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; margin-top: 16px; }
.chip { display: inline-flex; gap: 8px; align-items: center; border: 2px solid var(--teal-d); border-radius: 99px; padding: 4px 6px 4px 14px; background: var(--teal-bg); font-weight: 700; }
.chip button { border: 0; background: transparent; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; color: var(--ink2); }
.chip button:hover { background: var(--line); }
.subh { margin: 22px 0 0; font-size: 1.15rem; font-weight: 800; color: var(--ink2); }
.co2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.co2 b { font-size: 2rem; font-stretch: 75%; font-weight: 800; line-height: 1; color: var(--teal-d); }
.co2.lv1 b { color: var(--ink); }
.co2.lv2 b { color: var(--red); }
.grp.m h3 { border-bottom-color: var(--red); }
.recipes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
.rcp { background: var(--surface); border: 2px solid var(--line); border-top: 6px solid var(--yellow); border-radius: 14px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.rcp h3 { font-size: 1.5rem; font-weight: 800; }
.rcp ol { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
.empty { padding: 22px; border: 2px dashed var(--line); border-radius: 14px; color: var(--ink2); margin-top: 16px; }
.story { margin-top: 16px; padding: 16px 18px; border-radius: 12px; background: var(--teal-bg); display: grid; gap: 4px; }

/* knowledge */
.kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 22px; }
.kc { display: grid; gap: 8px; align-content: start; min-width: 0; }
.kc h3 { font-size: 1.3rem; }
.bars { display: grid; gap: 10px; margin-top: 6px; }
.bar { display: grid; grid-template-columns: 7em 1fr 3.6em; gap: 10px; align-items: center; }
.bar .track { background: var(--bg); border-radius: 6px; height: 28px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--teal-d); border-radius: 6px; min-width: 4px; }
.bar.hi .fill { background: var(--red); }
.bar .v { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.duel div, .bigstat { border-radius: 12px; padding: 12px; background: var(--bg); }
.duel b, .bigstat b { font-size: 2.4rem; font-stretch: 75%; font-weight: 800; display: block; line-height: 1.1; }
.duel .hi b, .bigstat.hi b { color: var(--red); }
.duel .lo b, .bigstat.lo b { color: var(--teal-d); }
.duel span, .bigstat span { font-size: .9rem; color: var(--ink2); }
sup a { text-decoration: none; font-weight: 700; padding: 0 1px; }
.callout ol { margin: 8px 0; padding-left: 1.5em; display: grid; gap: 4px; }
.callout { margin-top: 24px; padding: 18px 20px; border-radius: 14px; background: var(--yellow-bg); font-weight: 600; }


.quiz{margin-top:22px;display:grid;gap:18px}
.qbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.qscore{font-weight:800;font-size:1.2rem}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.qc{display:grid;gap:12px;align-content:start;min-width:0}
.qn{font-weight:800;color:var(--teal-d);font-stretch:75%;letter-spacing:.06em}
.qc h3{font-size:1.45rem;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 10px;min-height:72px;cursor:pointer;font-weight:800;font-size:1.1rem;line-height:1.25}
.opt:hover:not(:disabled){border-color:var(--teal-d)}
.opt:disabled{cursor:default}
.opt.right{background:var(--teal-bg);border-color:var(--teal-d)}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.ans{padding:12px 14px;border-radius:12px;background:var(--yellow-bg)}
.ans b{display:block;margin-bottom:4px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}

/* pledge */
.pledges { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; }
.pledge { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; cursor: pointer; font-weight: 700; min-height: 84px; }
.pledge:hover { border-color: var(--teal-d); }
.pledge[aria-pressed=true] { border-color: var(--teal-d); background: var(--teal-bg); }
.pledged { margin-top: 16px; padding: 16px 18px; border-radius: 12px; background: var(--teal-bg); display: none; gap: 10px; }
.pledged.on { display: grid; }

.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
.tip { padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
.src { margin-top: 18px; font-size: .92rem; color: var(--ink2); }
.src ol { padding-left: 1.6em; margin: 8px 0 0; display: grid; gap: 6px; }
footer { margin-top: 44px; padding-top: 18px; border-top: 2px solid var(--line); color: var(--ink2); font-size: .92rem; display: grid; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand"></div>
    <div class="ctrls">
      <select id="region"></select>
      <button class="btn" id="langBtn" type="button"></button>
    </div>
  </div>
  <header class="hero">
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="reg"><span class="pill" id="regPill"></span><span class="note" id="regNote"></span></div>
  </header>
</div>

<nav class="nav" aria-label="sections"><div class="wrap" id="nav"></div></nav>

<div class="wrap">
  <section id="season">
    <h2 id="t-season"></h2>
    <p class="lead" id="l-season"></p>
    <div class="monthbox panel">
      <div class="mhead"><div class="mbig" id="mbig"></div><div class="mname" id="mname"></div></div>
      <input type="range" id="month" min="1" max="12" step="1" aria-labelledby="t-season">
      <div class="mrow" id="mrow"></div>
      <div class="legend" id="legend"></div>
      <p class="note" id="regInfo"></p>
    </div>
    <div id="groups"></div>
  </section>

  <section id="cook">
    <h2 id="t-cook"></h2>
    <p class="lead" id="l-cook"></p>
    <div class="chips" id="chips"></div>
    <div class="recipes" id="recipes"></div>
    <div class="story" id="story"></div>
  </section>

  <section id="carbon">
    <h2 id="t-carbon"></h2>
    <p class="lead" id="l-carbon"></p>
    <div class="quiz" id="kgrid"></div>
    <div class="callout" id="callout"></div>
  </section>

  <section id="pledge">
    <h2 id="t-pledge"></h2>
    <p class="lead" id="l-pledge"></p>
    <div class="pledges" id="pledges"></div>
    <div class="pledged" id="pledged"></div>
  </section>

  <section id="tips">
    <h2 id="t-tips"></h2>
    <div class="tips" id="tipsGrid"></div>
    <div class="src panel" id="src"></div>
  </section>

  <footer id="foot"></footer>
</div>

function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

function tile(id, w, s) {

  var tg = '';

    '<div class="tags">' + tg + '</div>' +

function renderSeason() {

    if (extra.length) h += '<h4 class="subh">' + (ids.length ? s.always : s.alwaysM) + '</h4><div class="grid">' + extra.map(function (id) { return tile(id, w, s); }).join('') + '</div>';

function fill(str, a, b) { return str.replace(/\{n1\}/g, a).replace(/\{n2\}/g, b == null ? a : b).replace(/\{n\}/g, a); }
function portion(it) { return it.g || { v: 150, f: 150, s: 100, m: 100 }[it.k]; }

  if (it.k === 'm') return it.id === 'pork' || it.id === 'chicken' ? null : ITEMS.chicken;

function nmR(it) {

function buildRecipes(ids) {

function renderPledged() {
